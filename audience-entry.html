
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audience Registration - Melody Magic Digital Auditorium</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:18px;
 background:#090909;
 color:white;
 font-family:Arial,sans-serif;
}

.container{
 max-width:520px;
 margin:25px auto;
}

header{
 text-align:center;
 padding:24px 15px;
 background:linear-gradient(135deg,#302000,#090909);
 border:1px solid #b38a35;
 border-radius:14px;
}

header h1{
 color:#e9bd55;
 margin:0 0 8px;
}

header p{color:#ccc;margin:5px}

.card{
 background:#151515;
 border:1px solid #49402e;
 border-radius:12px;
 padding:18px;
 margin-top:15px;
}

h2{
 color:#e9bd55;
 font-size:19px;
 margin-top:0;
}

.show-info{
 background:#202020;
 border-radius:8px;
 padding:13px;
 margin:12px 0;
 line-height:1.7;
}

label{
 display:block;
 color:#ddd;
 font-size:14px;
 margin-top:13px;
}

input{
 width:100%;
 padding:13px;
 margin-top:6px;
 border-radius:7px;
 border:1px solid #555;
 background:#090909;
 color:white;
 font-size:15px;
}

button,.btn{
 display:block;
 width:100%;
 padding:13px;
 margin-top:16px;
 border:0;
 border-radius:8px;
 background:#d5a83e;
 color:#111;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
 text-align:center;
 text-decoration:none;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

.secondary{
 background:#383838;
 color:white;
}

.status{
 padding:12px;
 margin-top:12px;
 border-radius:7px;
 background:#222;
 color:#ddd;
 font-size:13px;
 line-height:1.5;
}

.hidden{display:none!important}

footer{
 text-align:center;
 color:#999;
 padding:22px 5px;
 font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<header>
 <h1>🎤 Melody Magic</h1>
 <p>Digital Auditorium</p>
 <p>Audience Registration</p>
</header>

<section class="card">

 <h2>🎟️ Register for the Show</h2>

 <div id="showInfo" class="show-info">
  Loading show details...
 </div>

 <form id="audienceForm">

  <label for="audienceName">Your Full Name *</label>
  <input
   id="audienceName"
   type="text"
   maxlength="80"
   placeholder="Enter your name"
   required
  >

  <label for="audienceMobile">Mobile Number *</label>
  <input
   id="audienceMobile"
   type="tel"
   inputmode="numeric"
   maxlength="15"
   placeholder="Enter your mobile number"
   required
  >

  <label for="audienceEmail">Email Address (Optional)</label>
  <input
   id="audienceEmail"
   type="email"
   maxlength="120"
   placeholder="Enter your email"
  >

  <button id="registerBtn" type="submit">
   Register & Enter Auditorium
  </button>

 </form>

 <div id="message" class="status hidden"></div>

 <a
  id="continueBtn"
  class="btn secondary hidden"
  href="#"
 >
  Enter Live Auditorium
 </a>

</section>

<footer>
 Powered by Melody Magic Music Studio
</footer>

</div>

<script type="module">

import {db} from "./firebase.js";

import {
 ref,
 get,
 push,
 set
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const showId = params.get("showId");

let currentShow = null;
let performanceUrl = "";

function showMessage(text){
 $("message").textContent = text;
 $("message").classList.remove("hidden");
}

function normaliseMobile(value){
 return String(value || "").replace(/\D/g,"");
}

function formatMoney(value){
 return "₹" + Number(value || 0).toLocaleString("en-IN");
}

async function loadShow(){

 if(!showId || !/^[a-zA-Z0-9_-]{1,150}$/.test(showId)){
  throw new Error("Invalid show link.");
 }

 const snapshot = await get(ref(db,"shows/"+showId));

 if(!snapshot.exists()){
  throw new Error("This show could not be found.");
 }

 const show = snapshot.val();

 if(!["Published","Live"].includes(show.status)){
  throw new Error("This show is not currently available for registration.");
 }

 currentShow = show;

 $("showInfo").innerHTML = `
  <strong style="color:#e9bd55">${escapeHTML(show.name || "Live Show")}</strong>
  <br>
  📅 ${escapeHTML(show.date || "Date not announced")}
  <br>
  🕒 ${escapeHTML(show.time || "Time not announced")}
  <br>
  🎵 ${escapeHTML(show.type || "Music Show")}
  <br>
  🎟️ Audience Entry:
  <strong>${Number(show.audienceFee || 0) === 0
    ? "FREE"
    : formatMoney(show.audienceFee)}</strong>
 `;

 performanceUrl =
  "live-performance.html?showId=" +
  encodeURIComponent(showId);

}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 })[c]);
}

$("audienceForm").addEventListener("submit",async event=>{

 event.preventDefault();

 if(!currentShow){
  showMessage("Show details are not available.");
  return;
 }

 const name = $("audienceName").value.trim();
 const mobile = normaliseMobile($("audienceMobile").value);
 const email = $("audienceEmail").value.trim();

 if(name.length < 2){
  showMessage("Please enter your full name.");
  return;
 }

 if(mobile.length < 10 || mobile.length > 15){
  showMessage("Please enter a valid mobile number.");
  return;
 }

 if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
  showMessage("Please enter a valid email address.");
  return;
 }

 const button = $("registerBtn");
 button.disabled = true;
 button.textContent = "Registering...";

 try{

  const registrationRef = push(
   ref(db,"audienceRegistrations/"+showId)
  );

  const registration = {
   registrationId:registrationRef.key,
   showId:showId,
   showName:currentShow.name || "",
   audienceName:name,
   mobile:mobile,
   email:email,
   status:"Registered",
   paymentStatus:
    Number(currentShow.audienceFee || 0) === 0
     ? "Not Required"
     : "Pending",
   entryFee:Number(currentShow.audienceFee || 0),
   createdAt:Date.now()
  };

  await set(registrationRef,registration);

  showMessage(
   "Registration successful! You can now enter the auditorium."
  );

  $("audienceForm").classList.add("hidden");

  $("continueBtn").href = performanceUrl;
  $("continueBtn").classList.remove("hidden");

  // Automatically open the audience performance page.
  setTimeout(()=>{
   location.href = performanceUrl;
  },1500);

 }catch(error){

  console.error(error);

  showMessage(
   "Registration failed: " +
   error.message +
   ". Please check your Firebase Realtime Database permissions."
  );

  button.disabled = false;
  button.textContent = "Register & Enter Auditorium";

 }

});

loadShow().catch(error=>{
 $("showInfo").textContent = error.message;
 $("registerBtn").disabled = true;
 showMessage(error.message);
});

</script>

</body>
</html>

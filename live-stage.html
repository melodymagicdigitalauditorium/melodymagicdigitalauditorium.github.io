<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melody Magic Live Stage</title>
<style>
:root{--gold:#e8c36c;--line:#51401e;--bg:#090909;--card:#151515;--muted:#bdb7ac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px/1.45 Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#111;border-bottom:1px solid var(--line)}header h1{font-size:18px;color:var(--gold);margin:0}.status{font-size:12px;color:var(--muted)}
main{max-width:1400px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px}.stage-column{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.card h2,.card h3{margin:0 0 8px;color:var(--gold);font-size:15px}
#livekitArea{padding:0;background:transparent;border:0}#mmLiveKitPanel{max-width:none!important;width:100%!important;margin:0!important;padding:10px!important;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:8px!important}
#mmLiveStatus,#mmRoleInfo,#mmJoinBtn,#mmLeaveBtn{grid-column:1/-1}#mmVideoGrid{grid-column:1;grid-template-columns:minmax(0,1fr)!important}#mmVideoGrid .mm-video-box{min-height:250px}#mmVideoGrid video{min-height:250px!important;max-height:60vh!important;object-fit:cover!important}
#mmCommentsList,#mmCommentInput,#mmSendCommentBtn,#mmCommentHint,#mmReactionSection{grid-column:2}#mmCommentsList{max-height:44vh!important}#mmReactionButtons button{min-width:35px!important;min-height:35px!important;font-size:20px!important;padding:3px 7px!important}#mmReactionOverlay{min-height:40px!important}
#mmPerformersHeading,#mmAudioEffects,#mmHostControls{display:none!important}#mmYoutubeFrame{width:100%!important;aspect-ratio:16/9!important;min-height:0!important}
.mm-section{margin-top:7px!important;padding-top:7px!important}.mm-card{padding:8px!important;margin:4px 0!important}.mm-list{max-height:170px!important}#mmLiveKitPanel .mm-two-column{grid-template-columns:1fr 1fr!important}
.sidebar{min-width:0}.sidebar .card{margin:0 0 10px}#performerQueue{max-height:32vh;overflow:auto}#compactHelp{font-size:12px;color:var(--muted)}footer{text-align:center;color:#777;padding:8px}
@media(max-width:850px){main{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:8px}#mmLiveKitPanel{grid-template-columns:1fr}#mmCommentsList,#mmCommentInput,#mmSendCommentBtn,#mmCommentHint,#mmReactionSection{grid-column:1}#mmCommentsList{max-height:24vh!important}#mmVideoGrid video{max-height:45vh!important;min-height:180px!important}}
@media(max-width:520px){header h1{font-size:16px}main{padding:6px;gap:6px}.sidebar{grid-template-columns:1fr}.card{padding:8px}#mmVideoGrid video{min-height:160px!important}}

/* Stage hierarchy: selected performer is the large tile, waiting singers are compact */
#mmVideoGrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;align-items:start;gap:8px!important}
#mmVideoGrid .mm-main-stage{grid-column:1/-1!important;min-height:0!important;border:2px solid var(--gold)!important}
#mmVideoGrid .mm-main-stage video{width:100%!important;min-height:260px!important;max-height:65vh!important;object-fit:contain!important}
#mmVideoGrid .mm-waiting-stage{min-height:90px!important;opacity:.9}
#mmVideoGrid .mm-waiting-stage video{width:100%!important;min-height:90px!important;max-height:170px!important;object-fit:cover!important}
#mmVideoGrid .mm-video-name{font-size:12px!important;padding:5px!important}
@media(max-width:600px){#mmVideoGrid{grid-template-columns:1fr!important}#mmVideoGrid .mm-main-stage{grid-column:1!important}#mmVideoGrid .mm-main-stage video{min-height:180px!important;max-height:45vh!important}#mmVideoGrid .mm-waiting-stage video{min-height:100px!important;max-height:150px!important}}

/* Shared karaoke player: compact audience view, larger singer view */
#karaokeCard{display:flex;flex-direction:column;gap:6px}
#mmPlaybackStatus{font-size:11px;color:var(--muted);min-height:16px}
#mmYoutubePlayer{width:100%;max-width:240px;min-height:0;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#000;margin-left:auto}
#mmYoutubePlayer iframe,#mmYoutubeFrame{width:100%!important;height:100%!important;min-height:0!important;display:block}
body[data-mode="singer"] #mmYoutubePlayer{max-width:520px;margin:0 auto;min-height:180px}
body[data-mode="host"] #mmYoutubePlayer{max-width:520px;margin:0 auto;min-height:180px}
body[data-mode="audience"] #mmYoutubePlayer{max-width:240px;min-height:0}
@media(max-width:850px){#mmYoutubePlayer{max-width:100%!important}body[data-mode="singer"] #mmYoutubePlayer,body[data-mode="host"] #mmYoutubePlayer{max-width:100%!important}}
/* === Compact Black & Gold Live Stage layout (visual-only overrides) === */
header{padding:6px 10px;min-height:42px}
header h1{font-size:16px;letter-spacing:.2px}
header .status{font-size:11px}
main{max-width:1100px;padding:7px;grid-template-columns:minmax(0,1fr);gap:7px}
.stage-column{min-width:0}
.stage-column>.card:first-child{padding:7px 9px;margin-bottom:6px}
.stage-column>.card:first-child h2{font-size:15px;margin:0 0 2px}
.stage-column>.card:first-child .status{font-size:11px}
#livekitArea{margin:0!important}
#mmLiveKitPanel{padding:5px!important;display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:5px!important}
#mmLiveStatus,#mmRoleInfo,#mmJoinBtn,#mmLeaveBtn{grid-column:1/-1!important}
#mmVideoGrid{grid-column:1/-1!important;display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:6px!important;align-items:start!important}
#mmVideoGrid .mm-video-box{grid-column:auto!important;min-height:0!important;opacity:1!important}
#mmVideoGrid .mm-main-stage{grid-column:1/-1!important;min-height:0!important;border:2px solid var(--gold)!important}
#mmVideoGrid .mm-main-stage video{width:100%!important;min-height:220px!important;height:auto!important;max-height:62vh!important;aspect-ratio:16/9!important;object-fit:contain!important}
#mmVideoGrid .mm-waiting-stage{grid-column:span 1!important;min-height:0!important;opacity:.92!important}
#mmVideoGrid .mm-waiting-stage video{width:100%!important;min-height:90px!important;height:auto!important;max-height:180px!important;aspect-ratio:4/3!important;object-fit:cover!important}
#mmVideoGrid .mm-video-name{font-size:11px!important;padding:4px!important}
#mmCommentsList,#mmCommentInput,#mmSendCommentBtn,#mmCommentHint,#mmReactionSection{grid-column:1/-1!important}
#mmCommentsList{max-height:22vh!important}
#mmReactionButtons button{min-width:30px!important;min-height:30px!important;font-size:18px!important;padding:2px 6px!important}
#mmReactionOverlay{min-height:28px!important}
.card{padding:8px;margin-bottom:7px;border-radius:9px}
.card h2,.card h3{font-size:14px;margin:0 0 5px}
.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.sidebar .card{margin:0;min-width:0}
#performerQueue{max-height:22vh;overflow:auto;font-size:12px}
#compactHelp{font-size:11px}
#karaokeCard{gap:4px}
#mmPlaybackStatus{font-size:10px;min-height:0}
#mmYoutubePlayer{max-width:100%!important;margin:0!important;min-height:0!important;aspect-ratio:16/9!important}
body[data-mode="singer"] #mmYoutubePlayer,body[data-mode="host"] #mmYoutubePlayer{max-width:100%!important;min-height:0!important;margin:0!important}
#mmYoutubePlayer iframe,#mmYoutubeFrame{min-height:0!important}
footer{padding:5px;font-size:11px}
@media(max-width:600px){
 header{padding:5px 8px}
 header h1{font-size:14px}
 header .status{font-size:10px}
 main{padding:5px;gap:5px}
 .sidebar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
 .card{padding:7px;margin-bottom:5px}
 #mmVideoGrid{grid-template-columns:minmax(0,1fr)!important}
 #mmVideoGrid .mm-main-stage{grid-column:1/-1!important}
 #mmVideoGrid .mm-main-stage video{min-height:190px!important;max-height:50vh!important;aspect-ratio:16/9!important}
 #mmVideoGrid .mm-waiting-stage video{min-height:90px!important;max-height:145px!important;aspect-ratio:4/3!important}
 #mmCommentsList{max-height:20vh!important}
 #mmYoutubePlayer{max-width:100%!important}
 body[data-mode="host"] #mmYoutubePlayer,body[data-mode="singer"] #mmYoutubePlayer{max-width:100%!important;min-height:0!important}
}
@media(max-width:370px){
 .sidebar{grid-template-columns:1fr}
 #mmVideoGrid video{max-height:26vh!important}
}
/* === End compact layout === */
</style></head><body>
<header><h1>🎤 Melody Magic Live Stage</h1><span class="status">Live video • Chat • Reactions</span></header>
<main><section class="stage-column"><div class="card"><h2 id="showTitle">Loading show…</h2><div id="showStatus" class="status">Connecting…</div><div id="loginStatus" class="status"></div></div><section id="livekitArea" aria-label="Live Stage"></section></section>
<aside class="sidebar"><div class="card"><h3>🎤 Singer Queue</h3><div id="performerQueue">Queue updates appear after connection.</div></div><div class="card" id="karaokeCard"><h3>🎵 Shared Karaoke</h3><div id="compactHelp">Shared, synchronized karaoke</div><div id="mmPlaybackStatus">Waiting for host to choose a song.</div><div id="mmYoutubePlayer"></div></div></aside></main><footer>Melody Magic Music Studio</footer>
<script>window.youtubeApiReady=false;window.youtubeApiPromise=new Promise(resolve=>window.youtubeApiResolve=resolve);window.onYouTubeIframeAPIReady=()=>{window.youtubeApiReady=true;window.youtubeApiResolve()};</script><script src="https://www.youtube.com/iframe_api"></script>
<script type="module">import{auth,db,connectAuditorium}from"./firebase.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{ref,get,onValue}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";const params=new URLSearchParams(location.search),showId=params.get("showId"),mode=(params.get("mode")||"audience").toLowerCase(),$=id=>document.getElementById(id);document.body.dataset.mode=mode;if(!showId){$("showStatus").textContent="Show ID missing. Open this page from a show link."}else connectAuditorium().then(()=>onAuthStateChanged(auth,async user=>{if(!user)return;try{const snap=await get(ref(db,"shows/"+showId));if(!snap.exists()){$("showStatus").textContent="Show not found";return}const data=snap.val();$("showTitle").textContent=data.name||"Melody Magic Live Stage";$("showStatus").textContent=(data.status||"")+" • "+(data.date||"")+" "+(data.time||"");$("loginStatus").textContent="Signed in • Live stage ready";onValue(ref(db,"performanceQueue/"+showId),q=>{const entries=Object.values(q.val()||{}).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));$("performerQueue").innerHTML=entries.length?entries.map((p,i)=>"<div style='padding:5px;border-bottom:1px solid #333'>"+(i+1)+". "+(p.singerName||p.name||"Singer")+"</div>").join(""):"No queued singers yet."});await import("./livekit.js?v=20261128-clean-vocal-peak-control-1")}catch(err){$("showStatus").textContent="Connection error: "+err.message}})).catch(err=>{$("loginStatus").textContent="Sign-in error: "+err.message});</script><script type="module">
import {db} from "./firebase.js";
import {ref,get} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
(async()=>{
 const showId=new URLSearchParams(location.search).get("showId");
 if(!showId)return;
 try{
  const snap=await get(ref(db,"shows/"+showId));
  if(!snap.exists())return;
  const s=snap.val()||{};
  const date=String(s.showDate||s.date||"").trim();
  const time=String(s.showTime||s.time||"00:00").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
  const tm=/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(time);
  if(!tm)return;
  const start=new Date(date+"T"+tm[1].padStart(2,"0")+":"+tm[2]+":"+(tm[3]||"00"));
  if(!Number.isFinite(start.getTime())||Date.now()<start.getTime())return;
  document.title="Show Finished | Melody Magic Digital Auditorium";
  document.body.innerHTML="";
  const style=document.createElement("style");
  style.textContent="*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#090909;color:#fff;font:16px Arial,sans-serif}.finished{max-width:560px;width:100%;padding:32px 24px;text-align:center;background:#171717;border:1px solid #b58b35;border-radius:16px;box-shadow:0 15px 45px #0008}.brand{color:#e8c36c;font-weight:800;letter-spacing:2px;font-size:20px}.tag{display:inline-block;margin:22px 0 8px;padding:7px 13px;border:1px solid #b58b35;border-radius:30px;color:#e8c36c;font-size:12px;letter-spacing:1px}.finished h1{color:#f2d58e;font-size:27px;margin:8px 0 12px}.finished p{color:#d1ccc2;line-height:1.7}.finished a{display:inline-block;margin-top:16px;padding:13px 22px;border-radius:8px;background:linear-gradient(135deg,#f3d78c,#bd8c36);color:#171006;text-decoration:none;font-weight:bold}.thanks{margin-top:24px!important;color:#e8c36c!important;font-size:14px}";
  document.head.appendChild(style);
  const card=document.createElement("main");card.className="finished";
  const brand=document.createElement("div");brand.className="brand";brand.textContent="MELODY MAGIC DIGITAL AUDITORIUM";
  const tag=document.createElement("div");tag.className="tag";tag.textContent="SHOW FINISHED";
  const h=document.createElement("h1");h.textContent=s.showName||s.name||s.title||"This show";
  const p=document.createElement("p");p.textContent="This show has finished. Thank you for being part of Melody Magic Digital Auditorium.";
  const p2=document.createElement("p");p2.textContent="Explore our other upcoming shows and join us again.";
  const link=document.createElement("a");link.href="./index.html#shows";link.textContent="VIEW OTHER SHOWS";
  const thanks=document.createElement("p");thanks.className="thanks";thanks.textContent="🎵 Thank you for attending. See you at our next show! ❤️";
  card.append(brand,tag,h,p,p2,link,thanks);document.body.appendChild(card);
 }catch(error){console.error("Show expiry check:",error);}
})();
</script>
</body></html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Login | Melody Magic Digital Auditorium</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #090909;
  color: #f5f0df;
  font-family: Arial, sans-serif;
}

.login {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  background: #171717;
  border: 1px solid #a8863b;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

.brand {
  color: #e5bd60;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

h2 { color: #e5bd60; }

p {
  color: #c8c3b6;
  line-height: 1.5;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #66532c;
  border-radius: 8px;
  background: #090909;
  color: white;
  font-size: 16px;
}

input:focus {
  outline: 1px solid #e5bd60;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border: 0;
  border-radius: 8px;
  background: #d5ad50;
  color: #17120a;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  margin-top: 18px;
  overflow-wrap: anywhere;
}

a {
  color: #e5bd60;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.signup {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #514326;
}
.signup a {
  font-weight: bold;
  font-size: 15px;
}
</style>
</head>

<body>

<div class="login">
  <div class="brand">MELODY MAGIC</div>
  <h2>Host Login</h2>

  <p>Sign in with your registered host email and password.</p>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="username"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">Sign In</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <div class="signup">
    <p>Not registered as a host yet?</p>
    <a href="host-signup.html">✨ SIGN UP FOR HOST</a>
  </div>

  <p><a href="index.html">Back to Home</a></p>
</div>

<script type="module">

import {
  db,
  hostLogin
} from "./firebase-host.js";

import {
  ref,
  get
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

let redirecting = false;

function showMessage(text, color = "#ff9999") {
  message.textContent = text;
  message.style.color = color;
}

function parseTimestamp(value) {
  if (value === undefined || value === null || value === "") {
    return NaN;
  }

  if (typeof value === "number") {
    return value < 1000000000000 ? value * 1000 : value;
  }

  const numeric = Number(value);

  if (Number.isFinite(numeric)) {
    return numeric < 1000000000000 ? numeric * 1000 : numeric;
  }

  const parsed = Date.parse(value);

  return Number.isNaN(parsed) ? NaN : parsed;
}

async function readHostApplication(applicationRef) {
  let timeoutId;

  try {
    return await Promise.race([
      get(applicationRef),
      new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          reject(new Error(
            "Database read timed out. Please check your internet connection."
          ));
        }, 12000);
      })
    ]);
  } finally {
    clearTimeout(timeoutId);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (redirecting) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";
  showMessage("Signing in...", "#e5bd60");

  try {

    // STEP 1: Firebase authentication
    const user = await hostLogin(email, password);

    if (!user || !user.uid) {
      throw new Error("Could not verify your login account.");
    }

    showMessage(
      "Login successful. Checking your host account...",
      "#e5bd60"
    );

    // STEP 2: Read the host application using authenticated UID
    const applicationRef = ref(
      db,
      "hostApplications/" + user.uid
    );

    const snapshot = await readHostApplication(applicationRef);

    if (!snapshot.exists()) {
      showMessage(
        "Host application not found for this login account. Please contact the administrator."
      );
      return;
    }

    const application = snapshot.val();

    console.log("Authenticated host UID:", user.uid);
    console.log("Host application:", application);

    // STEP 3: Check approval status
    const status = String(
      application.status || ""
    ).trim().toLowerCase();

    if (status !== "approved") {
      showMessage(
        "Your host application is not approved yet. Current status: " +
        (application.status || "Pending")
      );
      return;
    }

    // STEP 4: Check subscription dates
    const start = parseTimestamp(
      application.subscriptionStartAt
    );

    const end = parseTimestamp(
      application.subscriptionEndAt
    );

    const now = Date.now();

    console.log("Subscription start:", start);
    console.log("Subscription expiry:", end);
    console.log("Current time:", now);

    if (
      !Number.isFinite(start) ||
      !Number.isFinite(end) ||
      start <= 0 ||
      end <= 0
    ) {
      showMessage(
        "Your subscription dates are missing or invalid. Please contact the administrator."
      );
      return;
    }

    if (start > now) {
      showMessage(
        "Your subscription has not started yet. Please contact the administrator."
      );
      return;
    }

    if (end <= now) {
      showMessage(
        "Your subscription has expired. Please contact the administrator for renewal."
      );
      return;
    }

    // STEP 5: Host is approved and subscription is active
    showMessage(
      "Login successful! Opening your Host Dashboard...",
      "#9be7a5"
    );

    redirecting = true;

    window.location.replace("host-dashboard.html");

  } catch (error) {

    console.error("Host login error:", error);

    let errorMessage = error.message || "Unknown error";

    switch (error.code) {

      case "auth/invalid-credential":
        errorMessage = "Incorrect email or password.";
        break;

      case "auth/user-not-found":
        errorMessage = "No account found with this email.";
        break;

      case "auth/wrong-password":
        errorMessage = "Incorrect password.";
        break;

      case "auth/too-many-requests":
        errorMessage = "Too many attempts. Please try again later.";
        break;

      case "PERMISSION_DENIED":
      case "database/permission-denied":
        errorMessage =
          "Firebase database permission denied. Please contact the administrator.";
        break;

      case "auth/network-request-failed":
        errorMessage =
          "Network error. Check your internet connection.";
        break;
    }

    showMessage("Login failed: " + errorMessage);

  } finally {

    if (!redirecting) {
      button.disabled = false;
      button.textContent = "Sign In";
    }

  }
});

</script>

</body>
</html>
